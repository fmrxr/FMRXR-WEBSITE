<!-- Feature animation asset — FMRXR Studio × Neophi visual system -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="FMRXR Studio">
<title>NeoPhi · Hero: Full Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:transparent;
    font-family:'Noto Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;
  }
  .frame{
    width:100%;
    max-width:960px;
    aspect-ratio:4/3;
    position:relative;
    overflow:hidden;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#3e245e 0%,#1f122f 70%);
  }
  .frame svg{width:100%;height:100%;display:block}
  .tiny{font-size:11px;letter-spacing:.16em;text-transform:uppercase;fill:#ddd8e9}
  .connector{stroke:#9384bb;stroke-width:1.3;stroke-linecap:round;fill:none}
  .hub circle{fill:url(#centerSphereDark);stroke:#9384bb;stroke-width:2}
  .paper{fill:#3e245e;stroke:#9384bb;stroke-width:1}
  .paper-line{stroke:#ddd8e9;stroke-width:2;stroke-linecap:round}
  .node{fill:#7865aa;stroke:#9384bb;stroke-width:1.3}
  .pill-tag{filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .breathe{animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.28;transform:scale(.88)}50%{opacity:.75;transform:scale(1.08)}}
  .wf-trace{stroke-dasharray:4 5;animation:wftracemarch 1.1s linear infinite}
  @keyframes wftracemarch{to{stroke-dashoffset:-18}}
  .semantic-orbit{fill:none;stroke:#ddd8e9;stroke-width:1;stroke-dasharray:2 6;opacity:.4;animation:wforbit 28s linear infinite;transform-origin:450px 190px}
  @keyframes wforbit{to{transform:rotate(360deg)}}
  .filter-ring{fill:none;stroke:#9384bb;stroke-width:1;stroke-dasharray:3 6;opacity:.35;animation:wfspin 24s linear infinite reverse;transform-origin:450px 215px}
  @keyframes wfspin{to{transform:rotate(360deg)}}
  #hero-parallax{transform:translate(calc(var(--px,0) * 14px), calc(var(--py,0) * 14px));transition:transform .35s ease-out}
  @media(prefers-reduced-motion: reduce){.breathe{animation:none}.wf-trace{animation:none}.semantic-orbit{animation:none}.filter-ring{animation:none}}
</style>
</head>
<body>

<div class="frame" id="stage">
  <svg viewBox="0 -117.5 900 675" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="glow2">
        <stop offset="0%" stop-color="#9384bb" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#9384bb" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="centerSphereDark" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#9384bb"/>
        <stop offset="35%" stop-color="#7865aa"/>
        <stop offset="70%" stop-color="#3e245e"/>
        <stop offset="100%" stop-color="#1f122f"/>
      </radialGradient>
      <linearGradient id="pillGradDark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7865aa"/>
        <stop offset="100%" stop-color="#3e245e"/>
      </linearGradient>
    </defs>
    <g id="hero-parallax">
      <circle class="breathe" cx="450" cy="220" r="220" fill="url(#glow2)"/>
      <ellipse id="wf-ask-ring" class="semantic-orbit" cx="450" cy="190" rx="150" ry="95" opacity="0"/>

      <!-- 1 — ask your research question -->
      <g id="wf-ask">
        <rect x="270" y="152" width="360" height="58" rx="14" fill="#150c20" fill-opacity=".6" stroke="#9384bb" stroke-opacity=".4"/>
        <text x="292" y="186" font-family="'Noto Serif', Georgia, serif" font-style="italic" font-size="15" fill="#9384bb">Ask your research question…</text>
        <g class="pill-tag">
          <rect x="270" y="222" width="360" height="30" rx="15" fill="url(#pillGradDark)"/>
          <text x="450" y="242" text-anchor="middle" font-size="10" letter-spacing="1" fill="#fdfdfb">SEARCH THE MOST RELEVANT PAPERS</text>
        </g>
      </g>

      <!-- everything from "relevant papers" through "sourced synthesis" collapses together as one unit at loop-end,
           centered on the true canvas center (450, 220) — viewBox is 900x675 offset -117.5 -->
      <g id="wf-scene">
        <ellipse id="wf-graph-ring" class="filter-ring" cx="450" cy="215" rx="195" ry="150" opacity="0"/>

        <!-- citation traces + mid-nodes: drawn AFTER the synthesis card exists, anchored to its [n] markers -->
        <path id="wf-trace1" class="connector wf-trace" d="M392 235 Q200 150 128 95" opacity="0"/>
        <path id="wf-trace2" class="connector wf-trace" d="M440 244 Q200 220 128 188" opacity="0"/>
        <path id="wf-trace3" class="connector wf-trace" d="M488 235 Q250 290 123 273" opacity="0"/>
        <path id="wf-trace4" class="connector wf-trace" d="M392 253 Q680 150 800 100" opacity="0"/>
        <path id="wf-trace5" class="connector wf-trace" d="M440 253 Q650 200 795 188" opacity="0"/>
        <path id="wf-trace6" class="connector wf-trace" d="M488 253 Q680 290 800 273" opacity="0"/>
        <path id="wf-trace7" class="connector wf-trace" d="M392 272 Q390 150 448 62" opacity="0"/>
        <path id="wf-trace8" class="connector wf-trace" d="M440 272 Q450 340 448 432" opacity="0"/>
        <g id="wf-midnodes">
          <circle class="node" cx="230" cy="157.5" r="6"/>
          <circle class="node" cx="242" cy="218" r="6"/>
          <circle class="node" cx="278" cy="272" r="6"/>
          <circle class="node" cx="638" cy="163" r="6"/>
          <circle class="node" cx="634" cy="210" r="6"/>
          <circle class="node" cx="662" cy="277" r="6"/>
        </g>

        <g id="wf-papers">
          <g id="wf-src1" class="wf-src" data-tx="-90" data-ty="-60"><rect class="paper" x="70" y="45" width="58" height="76" rx="5"/><path class="paper-line" d="M82 66h34M82 78h28M82 90h34"/></g>
          <g id="wf-src2" class="wf-src" data-tx="-110" data-ty="0"><rect class="paper" x="65" y="150" width="58" height="76" rx="5"/><path class="paper-line" d="M77 171h34M77 183h28M77 195h34"/></g>
          <g id="wf-src3" class="wf-src" data-tx="-90" data-ty="60"><rect class="paper" x="70" y="255" width="58" height="76" rx="5"/><path class="paper-line" d="M82 276h34M82 288h28M82 300h34"/></g>
          <g id="wf-src4" class="wf-src" data-tx="90" data-ty="-60"><rect class="paper" x="772" y="45" width="58" height="76" rx="5"/><path class="paper-line" d="M784 66h34M784 78h28M784 90h34"/></g>
          <g id="wf-src5" class="wf-src" data-tx="110" data-ty="0"><rect class="paper" x="777" y="150" width="58" height="76" rx="5"/><path class="paper-line" d="M789 171h34M789 183h28M789 195h34"/></g>
          <g id="wf-src6" class="wf-src" data-tx="90" data-ty="60"><rect class="paper" x="772" y="255" width="58" height="76" rx="5"/><path class="paper-line" d="M784 276h34M784 288h28M784 300h34"/></g>
          <g id="wf-src7" class="wf-src2" data-tx="0" data-ty="-70"><rect class="paper" x="421" y="-16" width="58" height="76" rx="5"/><path class="paper-line" d="M433 5h34M433 17h28M433 29h34"/></g>
          <g id="wf-src8" class="wf-src2" data-tx="0" data-ty="70"><rect class="paper" x="421" y="430" width="58" height="76" rx="5"/><path class="paper-line" d="M433 451h34M433 463h28M433 475h34"/></g>
        </g>

        <g id="wf-btn-graph" class="pill-tag">
          <rect id="wf-btn-pulse" x="365" y="392" width="170" height="30" rx="15" fill="none" stroke="#ddd8e9" stroke-width="2" opacity="0"/>
          <rect x="365" y="392" width="170" height="30" rx="15" fill="url(#pillGradDark)"/>
          <text x="450" y="412" text-anchor="middle" font-size="10" letter-spacing="1" fill="#fdfdfb">KNOWLEDGE GRAPH →</text>
        </g>

        <g id="wf-hub" class="hub" transform="translate(450,215)">
          <circle r="46"/>
          <text id="wf-counter" x="0" y="-4" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-size="17" font-weight="700" fill="#fdfdfb" opacity="0">80,000,000</text>
          <text id="wf-counter-cap" x="0" y="18" text-anchor="middle" font-size="9" letter-spacing="2" fill="#ddd8e9" opacity="0">PAPERS</text>
        </g>

        <g id="wf-card" opacity="0" transform="translate(0,0)">
          <rect x="360" y="110" width="180" height="270" rx="14" fill="#3e245e" stroke="#9384bb"/>
          <text x="450" y="140" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#ddd8e9">EVIDENCE-BASED ANSWER</text>
          <rect id="wf-l1" x="382" y="160" width="136" height="6" rx="3" fill="#9384bb" style="transform-origin:382px 163px"/>
          <rect id="wf-l2" x="382" y="178" width="112" height="6" rx="3" fill="#9384bb" style="transform-origin:382px 181px"/>
          <rect id="wf-l3" x="382" y="196" width="126" height="6" rx="3" fill="#9384bb" style="transform-origin:382px 199px"/>
          <text id="wf-m1" x="392" y="240" font-size="11" fill="#9384bb" opacity="0">[1]</text>
          <text id="wf-m2" x="440" y="240" font-size="11" fill="#9384bb" opacity="0">[2]</text>
          <text id="wf-m3" x="488" y="240" font-size="11" fill="#9384bb" opacity="0">[3]</text>
          <text id="wf-m4" x="392" y="258" font-size="11" fill="#9384bb" opacity="0">[4]</text>
          <text id="wf-m5" x="440" y="258" font-size="11" fill="#9384bb" opacity="0">[5]</text>
          <text id="wf-m6" x="488" y="258" font-size="11" fill="#9384bb" opacity="0">[6]</text>
          <text id="wf-m7" x="392" y="276" font-size="11" fill="#9384bb" opacity="0">[7]</text>
          <text id="wf-m8" x="440" y="276" font-size="11" fill="#9384bb" opacity="0">[8]</text>
          <g id="wf-btn-synth" class="pill-tag" opacity="0">
            <rect id="wf-btn-synth-pulse" x="374" y="298" width="152" height="24" rx="12" fill="none" stroke="#ddd8e9" stroke-width="1.6" opacity="0"/>
            <rect x="374" y="298" width="152" height="24" rx="12" fill="url(#pillGradDark)"/>
            <text x="450" y="314" text-anchor="middle" font-size="8.5" letter-spacing="1" fill="#fdfdfb">SOURCED SYNTHESIS</text>
          </g>
          <text id="wf-dl" class="tiny" x="450" y="358" text-anchor="middle" opacity="0" font-size="8.5" fill="#ddd8e9">PDF · DOCX</text>
        </g>

        <!-- closing frame — merged from synthesis-03-research-loop.html: the four stages loop back
             to the question, echoing "Continue your workflow" right before the scene absorbs and restarts -->
        <g id="wf-loop" opacity="0">
          <!-- the track itself IS a golden spiral (r = r0·φ^(θ/90°)) — not an oval — echoing
               NeoPhi's own logo mark (logo-dark.png: a golden spiral uncoiling into the Φ stem).
               The four stages sit further out along the spiral as it opens, in order. -->

          <g id="wf-loop-points">
            <circle id="wlp-1" cx="517.6" cy="179.3" r="10" fill="url(#centerSphereDark)" stroke="#9384bb" stroke-width="1.5"/>
            <circle id="wlp-2" cx="551.7" cy="247.7" r="12" fill="url(#centerSphereDark)" stroke="#9384bb" stroke-width="1.5"/>
            <circle id="wlp-3" cx="441.0" cy="302.8" r="14" fill="url(#centerSphereDark)" stroke="#9384bb" stroke-width="1.5"/>
            <circle id="wlp-4" cx="351.8" cy="123.8" r="16" fill="url(#centerSphereDark)" stroke="#9384bb" stroke-width="1.5"/>
          </g>
          <g class="tiny" font-size="9" fill="#ddd8e9">
            <text x="542" y="171" text-anchor="start">RESEARCH QUESTION</text>
            <text x="580" y="251" text-anchor="start">RELEVANT PAPERS</text>
            <text x="441" y="338" text-anchor="middle">KNOWLEDGE GRAPH</text>
            <text x="326" y="106" text-anchor="end">SOURCED SYNTHESIS</text>
          </g>
          <text class="tiny" x="450" y="219" text-anchor="middle" font-size="8.5" fill="#ddd8e9">WORKFLOW</text>
          <g id="wf-repeat" class="pill-tag" opacity="0">
            <rect x="405" y="-10" width="90" height="26" rx="13" fill="url(#pillGradDark)"/>
            <text x="450" y="7" text-anchor="middle" font-size="9.5" letter-spacing="1.5" fill="#fdfdfb">REPEAT</text>
          </g>
        </g>

        <!-- closing quote — the final punctuation before the scene absorbs and restarts.
             The real NeoPhi logo (logo.png), not text — per brand feedback. -->

  var traceIdsExtra = ["#wf-trace7","#wf-trace8"];
  var markerIds = ["#wf-m1","#wf-m2","#wf-m3","#wf-m4","#wf-m5","#wf-m6"];
  var markerIdsExtra = ["#wf-m7","#wf-m8"];
  var midNodes = "#wf-midnodes .node";

  var ovZoneALines = "#wf-ov-zoneA-lines path";
  var ovZoneDLines = "#wf-ov-zoneD-lines path";
  var ovZoneBClLines = "#wf-ov-zoneBCl-lines path";
  var ovZoneBCuLines = "#wf-ov-zoneBCu-lines path";
  var ovZoneANodes = "#wf-ov-zoneA-nodes .node";
  var ovZoneDNodes = "#wf-ov-zoneD-nodes .node";
  var ovZoneBClNodes = "#wf-ov-zoneBCl-nodes .node";
  var ovZoneBCuNodes = "#wf-ov-zoneBCu-nodes .node";
  var ovPapers = "#wf-ov-papers > g";
  var ovHlRows = ["#wf-hl-row1","#wf-hl-row2","#wf-hl-row3"];

  var tl = gsap.timeline({
    repeat:-1, repeatDelay:1.6,
    defaults:{ease:"power2.out", duration:.6},
    paused: reduced
  });
  var counterEl = document.getElementById("wf-counter");
  var counterCapEl = document.getElementById("wf-counter-cap");
  function fmtCount(n){
    n = Math.round(n);
    if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
    if(n >= 1000) return Math.round(n/1000) + "K";
    return String(n);
  }
  var counter = {n:80000000};

  tl.set("#wf-ask", {opacity:0})
    .set("#wf-ask-ring", {opacity:0})
    .set("#wf-scene", {scale:1, opacity:1, svgOrigin:"450 220"})
    .set("#wf-graph-ring", {opacity:0})
    .set(srcs, {x:function(i,t){return t.dataset.tx;}, y:function(i,t){return t.dataset.ty;}, opacity:0, scale:.6, transformOrigin:"center"})
    .set(srcsExtra, {x:function(i,t){return t.dataset.tx;}, y:function(i,t){return t.dataset.ty;}, opacity:0, scale:.6, transformOrigin:"center"})
    .set(traceIds, {opacity:0})
    .set(traceIdsExtra, {opacity:0})
    .set(midNodes, {opacity:0, scale:0, transformOrigin:"center"})
    .set("#wf-hub", {scale:0, transformOrigin:"center"})
    .set(["#wf-counter","#wf-counter-cap"], {opacity:0})
    .call(function(){
      counterEl.textContent = "80,000,000";
      counterCapEl.textContent = "PAPERS";
      counterCapEl.setAttribute("letter-spacing", "2");
      counterCapEl.setAttribute("font-size", "9");
    })
    .set("#wf-card", {opacity:0, scale:.85, transformOrigin:"center"})
    .set(["#wf-l1","#wf-l2","#wf-l3"], {scaleX:0})
    .set(markerIds, {opacity:0})
    .set(markerIdsExtra, {opacity:0})
    .set("#wf-dl", {opacity:0})
    .set("#wf-btn-graph", {opacity:0, scale:.9, transformOrigin:"center"})
    .set("#wf-btn-pulse", {opacity:0, scale:1, transformOrigin:"center"})
    .set("#wf-btn-synth", {opacity:0, scale:.9, transformOrigin:"center"})
    .set("#wf-btn-synth-pulse", {opacity:0, scale:1, transformOrigin:"center"})
    .set("#wf-loop", {opacity:0})
    .set("#wf-loop-cursor", {motionPath:{path:"#wf-loop-track", align:"#wf-loop-track", alignOrigin:[.5,.5], start:0, end:0}})
    .set("#wf-loop-points circle", {scale:1, transformOrigin:"center"})
    .set("#wf-repeat", {opacity:0, scale:.85, transformOrigin:"center"})
    .set("#wf-quote", {opacity:0, scale:.94, transformOrigin:"center"})
    .set("#wf-ov-scrim", {opacity:0})
    .set("#wf-ov-modal", {opacity:0, scale:.94})
    .set([ovZoneALines, ovZoneDLines, ovZoneBClLines, ovZoneBCuLines], {drawSVG:"0%"})
    .set([ovZoneANodes, ovZoneDNodes, ovZoneBClNodes, ovZoneBCuNodes], {opacity:0, scale:0, transformOrigin:"center"})
    .set(["#wf-ov-hub1","#wf-ov-hub2"], {scale:0, transformOrigin:"center"})
    .set(ovPapers, {opacity:0, scale:0, transformOrigin:"center"})
    .set(["#wf-ov-boundaryA","#wf-ov-boundaryD"], {opacity:0})
    .set(["#wf-hl-pulse","#wf-hl-glow","#wf-hl-connector","#wf-hl-panel"], {opacity:0})
    .set(ovHlRows, {opacity:0, x:8})

    // 1 — ask your research question
    .to("#wf-ask-ring", {opacity:1, duration:.7})
    .to("#wf-ask", {opacity:1, duration:.7}, "-=.3")
    .to({}, {duration:1.0})
    .to(["#wf-ask","#wf-ask-ring"], {opacity:0, duration:.5})

    // 2 — the corpus sorts down to the relevant papers
    .to("#wf-graph-ring", {opacity:1, duration:.6}, "-=.1")
    .to("#wf-hub", {scale:1, duration:.6, ease:"back.out(2)"}, "-=.45")
    .to(["#wf-counter","#wf-counter-cap"], {opacity:1, duration:.35}, "-=.25")
    .to(counter, {
      n:100, duration:1.8, ease:"power2.out",
      onUpdate:function(){ counterEl.textContent = fmtCount(counter.n); },
      onComplete:function(){
        counterEl.textContent = "MOST";
        counterCapEl.textContent = "RELEVANT PAPERS";
        counterCapEl.setAttribute("letter-spacing", ".5");
        counterCapEl.setAttribute("font-size", "7.5");
      }
    }, "-=.15")
    .to(srcs, {x:0, y:0, opacity:1, scale:1, duration:.4, stagger:.11, ease:"back.out(2)"}, "-=1.45")
    .to({}, {duration:.4})
    // the button appears with a single explicit highlight pulse, echoing the node highlight later on
    .to("#wf-btn-graph", {opacity:1, scale:1, duration:.4, ease:"back.out(2)"})
    .to("#wf-btn-pulse", {opacity:.9, scale:1.22, duration:.4, ease:"power2.out"}, "-=.05")
    .to("#wf-btn-pulse", {opacity:0, duration:.3})
    .to({}, {duration:.7})

    // 3 — the KNOWLEDGE GRAPH button opens a real modal overlay, framed like the platform's own graph
    // window — the open itself is a fast, modern-web-app transition: scrim and card appear together
    .to("#wf-btn-graph", {opacity:0, duration:.15})
    .to("#wf-ov-scrim", {opacity:.85, duration:.2}, "<")
    .to("#wf-ov-modal", {opacity:1, scale:1, duration:.22, ease:"power2.out"}, "<")
    .to(["#wf-ov-hub1","#wf-ov-hub2"], {scale:1, duration:.55, stagger:.06, ease:"back.out(2)"}, "-=.02")
    .addLabel("ovgrow", "-=.15")
    .to(ovZoneALines, {drawSVG:"100%", duration:.5, stagger:.12, ease:"power2.inOut"}, "ovgrow")
    .to(ovZoneDLines, {drawSVG:"100%", duration:.5, stagger:.12, ease:"power2.inOut"}, "ovgrow")
    .to(ovZoneBClLines, {drawSVG:"100%", duration:.45, stagger:.12, ease:"power2.inOut"}, "ovgrow")
    .to(ovZoneBCuLines, {drawSVG:"100%", duration:.45, stagger:.11, ease:"power2.inOut"}, "ovgrow")
    .to(["#wf-ov-boundaryA","#wf-ov-boundaryD"], {opacity:1, duration:.6}, "ovgrow")
    .to(ovZoneANodes, {opacity:1, scale:1, duration:.35, stagger:.12, ease:"back.out(2)"}, "ovgrow+=.3")
    .to(ovZoneDNodes, {opacity:1, scale:1, duration:.35, stagger:.12, ease:"back.out(2)"}, "ovgrow+=.3")
    .to(ovZoneBClNodes, {opacity:1, scale:1, duration:.35, stagger:.12, ease:"back.out(2)"}, "ovgrow+=.25")
    .to(ovZoneBCuNodes, {opacity:1, scale:1, duration:.35, stagger:.11, ease:"back.out(2)"}, "ovgrow+=.25")
    .to(ovPapers, {opacity:1, scale:1, duration:.35, stagger:.12, ease:"back.out(2)"}, "ovgrow+=.9")
    .to({}, {duration:.45})
    // 3b — one node opens its related-papers list (merged from graph-01 · See the connections),
    //      pulse mirrors the KNOWLEDGE GRAPH button's own highlight for a consistent affordance
    .to("#wf-hl-pulse", {opacity:.6, scale:1.7, duration:.6, transformOrigin:"center"})
    .to("#wf-hl-pulse", {opacity:0, duration:.45})
    .to("#wf-hl-pulse", {opacity:.4, scale:1.5, duration:.5, transformOrigin:"center"}, "-=.15")
    .to("#wf-hl-pulse", {opacity:0, duration:.45})
    .to("#wf-hl-glow", {opacity:1, duration:.35}, "-=.85")
    .to("#wf-hl-connector", {opacity:1, duration:.5, ease:"power2.inOut"}, "-=.3")
    .to("#wf-hl-panel", {opacity:1, duration:.4}, "-=.1")
    .to(ovHlRows, {opacity:1, x:0, duration:.35, stagger:.12, ease:"power2.out"}, "-=.25")
    .to({}, {duration:1.0})
    // 3c — the modal closes like a modern web overlay: the card itself scales down and fades,
    //      the scrim lingers a beat longer before lifting
    .to("#wf-ov-modal", {opacity:0, scale:.95, duration:.32, ease:"power2.in"})
    .to("#wf-ov-scrim", {opacity:0, duration:.4}, "-=.12")

    // 4 — exploring the graph surfaces more relevant papers: the whole orbit resettles smoothly as
    //     two new sources join it, so nothing looks static next to the newcomers
    .to({}, {duration:.2})
    .to(srcs, {opacity:.5, scale:.93, duration:.3, ease:"power1.inOut"})
    .to(srcs, {opacity:1, scale:1, duration:.45, stagger:.05, ease:"back.out(1.6)"}, "-=.05")
    .to(srcsExtra, {x:0, y:0, opacity:1, scale:1, duration:.45, stagger:.15, ease:"back.out(2)"}, "-=.35")
    .to({}, {duration:.3})

    // 5 — the graph resolves into a sourced synthesis: the card replaces the hub first, THEN the
    //     citation traces draw from its own [n] markers outward — never against the round hub, so
    //     nothing crosses awkwardly and everything stays anchored to the card's true center
    .to({}, {duration:.15})
    .to("#wf-hub", {opacity:0, scale:.6, duration:.35})
    .to("#wf-card", {opacity:1, scale:1, duration:.6, ease:"back.out(1.6)"}, "-=.2")
    .to(["#wf-l1","#wf-l2","#wf-l3"], {scaleX:1, duration:.45, stagger:.14}, "-=.2")
    .to({}, {duration:.15})
    .to(traceIds.concat(traceIdsExtra), {opacity:1, duration:.4, stagger:.1, ease:"power1.inOut"})
    .to(midNodes, {opacity:1, scale:1, duration:.3, stagger:.1, ease:"back.out(2)"}, "-=.6")
    .to(markerIds.concat(markerIdsExtra), {opacity:1, duration:.35, stagger:.1}, "-=.5")
    // the SOURCED SYNTHESIS button appears, gets a single click-style pulse, then reveals the
    // PDF · DOCX export row — mirroring the KNOWLEDGE GRAPH button's own affordance
    .to("#wf-btn-synth", {opacity:1, scale:1, duration:.35, ease:"back.out(2)"}, "-=.15")
    .to({}, {duration:.35})
    .to("#wf-btn-synth-pulse", {opacity:.9, scale:1.2, duration:.4, ease:"power2.out"})
    .to("#wf-btn-synth-pulse", {opacity:0, duration:.3})
    .to("#wf-dl", {opacity:1, duration:.3}, "-=.1")
    .to({}, {duration:1.1})

    // 5 — an elegant crossfade into the closing frame, merged from synthesis-03 · Continue your
    //     workflow: the traces and papers dissolve first, the answer softly sinks away last, and
    //     the workflow ring blooms up to meet it — never an abrupt flat cut
    .to([midNodes].concat(traceIds).concat(traceIdsExtra), {opacity:0, duration:.4, ease:"power1.in"})
    .to("#wf-papers", {opacity:0, scale:.92, duration:.55, ease:"power1.in", transformOrigin:"center"}, "-=.25")
    .to("#wf-graph-ring", {opacity:0, duration:.55}, "-=.45")
    .to("#wf-card", {opacity:0, scale:.9, duration:.6, ease:"power2.in", transformOrigin:"center"}, "-=.35")
    .addLabel("loopEnter", "-=.4")
    .set("#wf-loop", {scale:.88, transformOrigin:"center"}, "loopEnter")
    .to("#wf-loop", {opacity:1, scale:1, duration:.75, ease:"power2.out"}, "loopEnter")
    .addLabel("loopring", "-=.1")
    .to("#wf-loop-cursor", {motionPath:{path:"#wf-loop-track", align:"#wf-loop-track", alignOrigin:[.5,.5], start:0, end:1}, duration:2.6, ease:"none"}, "loopring")
    .to("#wf-loop-points circle", {scale:1.25, duration:.22, yoyo:true, repeat:1, stagger:.56, transformOrigin:"center", ease:"power2.out"}, "loopring")
    .to({}, {duration:.3})
    // the cycle closes on itself: REPEAT confirms it, then the whole ring gives way to the closing line
    .to("#wf-repeat", {opacity:1, scale:1, duration:.35, ease:"back.out(2)"})
    .to({}, {duration:.55})
    .to("#wf-loop", {opacity:0, duration:.4})
    .to("#wf-quote", {opacity:1, scale:1, duration:.6, ease:"power2.out"}, "-=.15")
    .to({}, {duration:1.9})
    .to("#wf-quote", {opacity:0, duration:.35})

    // 6 — everything absorbs into the exact center of the canvas at once, then the loop restarts
    .to("#wf-scene", {scale:0, opacity:0, duration:.7, ease:"power2.in", svgOrigin:"450 220"});

  if(!reduced){
    ScrollTrigger.create({
      trigger: "#stage", start: "top bottom", end: "bottom top",
      onEnter:function(){tl.play();}, onEnterBack:function(){tl.play();},
      onLeave:function(){tl.pause();}, onLeaveBack:function(){tl.pause();}
    });
  }
})();
</script>
</body>
</html>
