<!-- Feature animation asset — FMRXR Studio × Neophi visual system -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="FMRXR Studio">
<title>NeoPhi · Knowledge Graph: Identify patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:transparent;
    font-family:'Noto Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;
  }
  .frame{
    width:100%;
    max-width:640px;
    aspect-ratio:5/4;
    position:relative;
    overflow:hidden;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#fdfdfb 0%,#eae5e0 72%);
  }
  .frame svg{width:100%;height:100%;display:block}
  .tiny{font-size:9px;letter-spacing:.08em;text-transform:uppercase;fill:#5c5248}
  .node{fill:#fdfdfb;stroke:#7865aa;stroke-width:1.5}
  .connector{stroke:#7865aa;stroke-width:1.3;fill:none}
  .paper{fill:#fdfdfb;stroke:#dbd5cb;stroke-width:1}
  .paper-line{stroke:#dbd5cb;stroke-width:2;stroke-linecap:round}
  .boundary{fill:none;stroke:#ddd8e9;stroke-width:1;stroke-dasharray:2 5}
</style>
</head>
<body>

<div class="frame" id="stage">
  <svg viewBox="0 -40 500 400" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="centerSphereDark" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#9384bb"/>
        <stop offset="35%" stop-color="#7865aa"/>
        <stop offset="70%" stop-color="#3e245e"/>
        <stop offset="100%" stop-color="#1f122f"/>
      </radialGradient>
    </defs>
    <circle class="boundary" cx="100" cy="190" r="50"/>
    <circle class="boundary" cx="400" cy="190" r="50"/>

    <g id="cl-hub1" transform="translate(100 190)">
      <g id="cl-h1-lines">
        <path class="connector" d="M0 0 L-38 -28"/>
        <path class="connector" d="M0 0 L-42 16"/>
        <path class="connector" d="M0 0 L-12 40"/>
        <path class="connector" d="M0 0 L40 -6"/>
      </g>
      <circle cx="0" cy="0" r="26" fill="url(#centerSphereDark)"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-size="8" font-weight="700" letter-spacing=".3" fill="#fdfdfb">CONCEPT</text>
      <text x="0" y="8" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-size="8" font-weight="700" fill="#fdfdfb">1</text>
      <g id="cl-h1-nodes">
        <circle class="node" cx="-38" cy="-28" r="7"/>
        <circle class="node" cx="-42" cy="16" r="6"/>
        <circle class="node" cx="-12" cy="40" r="8"/>
        <circle class="node" cx="40" cy="-6" r="8"/>
      </g>
    </g>

    <g id="cl-hub2" transform="translate(400 190)">
      <g id="cl-h2-lines">
        <path class="connector" d="M0 0 L38 -28"/>
        <path class="connector" d="M0 0 L42 16"/>
        <path class="connector" d="M0 0 L12 40"/>
        <path class="connector" d="M0 0 L-40 -6"/>
      </g>
      <circle cx="0" cy="0" r="26" fill="url(#centerSphereDark)"/>
      <text x="0" y="-2" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-size="8" font-weight="700" letter-spacing=".3" fill="#fdfdfb">CONCEPT</text>
      <text x="0" y="8" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-size="8" font-weight="700" fill="#fdfdfb">2</text>
      <g id="cl-h2-nodes">
        <circle class="node" cx="38" cy="-28" r="7"/>
        <circle class="node" cx="42" cy="16" r="6"/>
        <circle class="node" cx="12" cy="40" r="8"/>
        <circle class="node" cx="-40" cy="-6" r="8"/>
      </g>
    </g>

    <g id="cl-chain-links">
      <path id="cl-seg1" class="connector" d="M140 184 L180 110"/>
      <path id="cl-seg2" class="connector" d="M180 110 L250 75"/>
      <path id="cl-seg3" class="connector" d="M250 75 L320 110"/>
      <path id="cl-seg4" class="connector" d="M320 110 L360 184"/>
    </g>
    <g id="cl-chain-nodes">
      <circle id="cl-p0" class="node" cx="180" cy="110" r="6"/>
      <circle id="cl-p1" class="node" cx="250" cy="75" r="7"/>
      <circle id="cl-p2" class="node" cx="320" cy="110" r="6"/>
    </g>
    <g id="cl-chain-papers">
      <g id="cl-paper1" transform="translate(160,147) rotate(-14)">
        <rect class="paper" x="-9" y="-12" width="18" height="23" rx="3"/>
        <path class="paper-line" d="M-5 -5.5h10M-5 -0.5h7M-5 4.5h10" stroke-width="1.1"/>
      </g>
      <g id="cl-paper2" transform="translate(215,92.5) rotate(10)">
        <rect class="paper" x="-9" y="-12" width="18" height="23" rx="3"/>
        <path class="paper-line" d="M-5 -5.5h10M-5 -0.5h7M-5 4.5h10" stroke-width="1.1"/>
      </g>
      <g id="cl-paper3" transform="translate(285,92.5) rotate(-10)">
        <rect class="paper" x="-9" y="-12" width="18" height="23" rx="3"/>
        <path class="paper-line" d="M-5 -5.5h10M-5 -0.5h7M-5 4.5h10" stroke-width="1.1"/>
      </g>
      <g id="cl-paper4" transform="translate(340,147) rotate(14)">
        <rect class="paper" x="-9" y="-12" width="18" height="23" rx="3"/>
        <path class="paper-line" d="M-5 -5.5h10M-5 -0.5h7M-5 4.5h10" stroke-width="1.1"/>
      </g>
    </g>

    <text id="cl-caption" class="tiny" x="250" y="335" text-anchor="middle" opacity="0">each pair of concepts, connected by a paper</text>
  </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
(function(){
  gsap.registerPlugin(DrawSVGPlugin, ScrollTrigger);
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var stageEl = document.getElementById("stage");
  stageEl.addEventListener("mousemove", function(e){
    var r = stageEl.getBoundingClientRect();
    stageEl.style.setProperty("--mx", ((e.clientX-r.left)/r.width*100).toFixed(1)+"%");
    stageEl.style.setProperty("--my", ((e.clientY-r.top)/r.height*100).toFixed(1)+"%");
  });
  stageEl.addEventListener("mouseleave", function(){
    stageEl.style.setProperty("--mx","50%");
    stageEl.style.setProperty("--my","50%");
  });

  var tl = gsap.timeline({
    repeat:-1, yoyo:true, repeatDelay:1.1,
    defaults:{ease:"power2.out", duration:.6},
    paused: reduced
  });

  tl.set("#cl-chain-links path", {drawSVG:"0%"})
    .set("#cl-chain-nodes circle", {opacity:0, scale:0, transformOrigin:"center"})
    .set("#cl-chain-papers > g", {opacity:0, scale:0, transformOrigin:"center"})
    .set("#cl-caption", {opacity:0})
    // both concept clusters are already open — now the chain between them forms
    .to({}, {duration:.5})
    .to("#cl-seg1", {drawSVG:"100%", duration:.5, ease:"power2.inOut"})
    .to("#cl-p0", {opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "-=.15")
    .to("#cl-paper1", {opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "-=.1")
    .to("#cl-seg2", {drawSVG:"100%", duration:.5, ease:"power2.inOut"})
    .to("#cl-p1", {opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "-=.15")
    .to("#cl-paper2", {opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "-=.1")
    .to("#cl-seg3", {drawSVG:"100%", duration:.5, ease:"power2.inOut"})
    .to("#cl-p2", {opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "-=.15")
    .to("#cl-paper3", {opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "-=.1")
    .to("#cl-seg4", {drawSVG:"100%", duration:.5, ease:"power2.inOut"})
    .to("#cl-paper4", {opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "-=.1")
    .to("#cl-caption", {opacity:1, duration:.4}, "-=.1")
    .to({}, {duration:1.4});

  if(!reduced){
    ScrollTrigger.create({
      trigger: "#stage", start: "top bottom", end: "bottom top",
      onEnter:function(){tl.play();}, onEnterBack:function(){tl.play();},
      onLeave:function(){tl.pause();}, onLeaveBack:function(){tl.pause();}
    });
  }
})();
</script>
</body>
</html>
