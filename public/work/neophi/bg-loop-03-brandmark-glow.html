<title>NeoPhi · BG Loop: Brand Mark Glow</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%}
  body{
    background:#0d0716;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .stage{
    position:relative;width:min(500px,90vw,51.6vh);aspect-ratio:9/16;overflow:hidden;
    container-type:size;
    background:
      radial-gradient(circle at 50% 50%,rgba(147,132,187,.16),transparent 46%),
      radial-gradient(circle at 50% 50%,#3e245e 0%,#1f122f 70%);
  }
  .halo{
    position:absolute;top:50%;left:50%;width:40cqmin;height:40cqmin;min-width:220px;min-height:220px;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(147,132,187,.35),transparent 70%);
    animation:halo 6s ease-in-out infinite;
  }
  @keyframes halo{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
  .ring{
    position:absolute;top:50%;left:50%;border-radius:50%;border:1px dashed rgba(147,132,187,.32);
    transform:translate(-50%,-50%);
  }
  .ring.r1{width:26cqmin;height:26cqmin;min-width:150px;min-height:150px;animation:spin 50s linear infinite}
  .ring.r2{width:38cqmin;height:38cqmin;min-width:210px;min-height:210px;border-style:dotted;border-color:rgba(221,216,233,.2);animation:spin 80s linear infinite reverse}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .mark{
    position:absolute;top:50%;left:50%;width:22cqmin;height:22cqmin;min-width:130px;min-height:130px;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 0 22px rgba(147,132,187,.55));
    animation:breathe 6s ease-in-out infinite;
  }
  .mark img{display:block;width:100%;height:100%;object-fit:contain}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.97);opacity:.9}50%{transform:translate(-50%,-50%) scale(1.03);opacity:1}}
  @media(prefers-reduced-motion: reduce){.halo,.ring,.mark{animation:none}}
</style>
</head>
