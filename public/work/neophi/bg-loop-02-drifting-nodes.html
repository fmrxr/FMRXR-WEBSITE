<!-- Feature animation asset — FMRXR Studio × NeoPhi visual system — minimal background loop: drifting nodes -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="author" content="FMRXR Studio">
<title>NeoPhi · BG Loop: Drifting Nodes</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%}
  body{
    background:#0d0716;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .stage{
    position:relative;width:min(500px,90vw,51.6vh);aspect-ratio:9/16;overflow:hidden;
    background:
      radial-gradient(circle at 50% 46%,rgba(147,132,187,.14),transparent 46%),
      radial-gradient(circle at 50% 50%,#3e245e 0%,#1f122f 70%);
  }
  svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .link{
    fill:none;stroke:#9384bb;stroke-width:1;stroke-dasharray:3 7;opacity:.4;
    animation:march 3.4s linear infinite;
  }
  @keyframes march{to{stroke-dashoffset:-40}}
  .node{fill:url(#nodeGrad);stroke:#9384bb;stroke-opacity:.5;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:pulse ease-in-out infinite}
  @media(prefers-reduced-motion: reduce){.link,.node{animation:none}}
  @keyframes pulse{0%,100%{opacity:.65;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 500 889" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="nodeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#9384bb"/>
      <stop offset="45%" stop-color="#7865aa"/>
      <stop offset="80%" stop-color="#3e245e"/>
      <stop offset="100%" stop-color="#1f122f"/>
    </radialGradient>
  </defs>

  <path class="link" d="M120 130 L230 90"/>
  <path class="link" d="M230 90 L360 165"/>
  <path class="link" d="M120 130 L95 260"/>
  <path class="link" d="M95 260 L215 310"/>
  <path class="link" d="M215 310 L360 165"/>
  <path class="link" d="M215 310 L165 450"/>
  <path class="link" d="M165 450 L300 490"/>
  <path class="link" d="M300 490 L360 165"/>
  <path class="link" d="M165 450 L110 590"/>
  <path class="link" d="M110 590 L245 640"/>
  <path class="link" d="M300 490 L245 640"/>
  <path class="link" d="M245 640 L285 780"/>
  <path class="link" d="M110 590 L150 760"/>

  <circle class="node" cx="120" cy="130" r="10" style="animation-duration:6.5s"/>
  <circle class="node" cx="230" cy="90" r="14" style="animation-duration:7.8s;animation-delay:.4s"/>
  <circle class="node" cx="360" cy="165" r="20" style="animation-duration:8.6s;animation-delay:.9s"/>
  <circle class="node" cx="95" cy="260" r="12" style="animation-duration:6.9s;animation-delay:1.3s"/>
  <circle class="node" cx="215" cy="310" r="26" style="animation-duration:9.4s;animation-delay:.2s"/>
  <circle class="node" cx="165" cy="450" r="15" style="animation-duration:7.1s;animation-delay:1.7s"/>
  <circle class="node" cx="300" cy="490" r="19" style="animation-duration:8s;animation-delay:.6s"/>
  <circle class="node" cx="110" cy="590" r="13" style="animation-duration:6.3s;animation-delay:2.1s"/>
  <circle class="node" cx="245" cy="640" r="17" style="animation-duration:7.5s;animation-delay:1.9s"/>
  <circle class="node" cx="285" cy="780" r="11" style="animation-duration:6.7s;animation-delay:1.1s"/>
  <circle class="node" cx="150" cy="760" r="9" style="animation-duration:6.1s;animation-delay:2.4s"/>
</svg>
</div>
</body>
</html>
