<!-- Feature animation asset — FMRXR Studio × Neophi visual system -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="FMRXR Studio">
<title>NeoPhi · Hero: Semantic Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:transparent;
    font-family:'Noto Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;
  }
  .frame{
    width:100%;
    max-width:960px;
    aspect-ratio:4/3;
    position:relative;
    overflow:hidden;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#3e245e 0%,#1f122f 70%);
  }
  .frame svg{width:100%;height:100%;display:block}
  .breathe{animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.28;transform:scale(.88)}50%{opacity:.75;transform:scale(1.08)}}
  .hg-edge .connector{stroke:#7865aa;stroke-width:2.5;stroke-linecap:round;fill:none}
  .hg-node circle{fill:#7865aa;stroke:#9384bb;stroke-width:1.5}
  .hg-node-bar{fill:rgba(255,255,255,.5)}
  .hg-node-center circle{fill:url(#centerSphereDark);stroke:#9384bb;stroke-width:2}
  #hero-parallax{transform:translate(calc(var(--px,0) * 14px), calc(var(--py,0) * 14px));transition:transform .35s ease-out}
  @media(prefers-reduced-motion: reduce){.breathe{animation:none}}
</style>
</head>
<body>

<div class="frame" id="stage">
  <svg viewBox="0 -117.5 900 675" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="glow2">
        <stop offset="0%" stop-color="#9384bb" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#9384bb" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="centerSphereDark" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#9384bb"/>
        <stop offset="35%" stop-color="#7865aa"/>
        <stop offset="70%" stop-color="#3e245e"/>
        <stop offset="100%" stop-color="#1f122f"/>
      </radialGradient>
    </defs>
    <g id="hero-parallax">
      <circle class="breathe" cx="450" cy="215" r="220" fill="url(#glow2)"/>

      <g id="hg-lines1" class="hg-edge">
        <path class="connector" d="M450 215 C380 190 300 165 248 142"/>
        <path class="connector" d="M450 215 C520 175 590 148 642 120"/>
        <path class="connector" d="M450 215 C540 235 630 255 700 272"/>
        <path class="connector" d="M450 215 C480 280 500 330 520 372"/>
        <path class="connector" d="M450 215 C400 270 340 315 300 352"/>
        <path class="connector" d="M450 215 C350 220 240 225 150 230"/>
      </g>
      <g id="hg-lines2" class="hg-edge">
        <path class="connector" d="M248 142 C210 110 175 82 140 55"/>
        <path class="connector" d="M248 142 C190 138 130 133 70 130"/>
        <path class="connector" d="M700 272 C750 245 790 222 820 205"/>
        <path class="connector" d="M700 272 C735 300 765 328 795 355"/>
        <path class="connector" d="M300 352 C245 372 200 388 165 400"/>
        <path class="connector" d="M300 352 C345 372 385 390 420 405"/>
      </g>
      <g id="hg-nodes2">
        <g class="hg-node" transform="translate(140,55)"><circle r="34"/></g>
        <g class="hg-node" transform="translate(70,130)"><circle r="42"/></g>
        <g class="hg-node" transform="translate(820,205)"><circle r="40"/></g>
        <g class="hg-node" transform="translate(795,355)"><circle r="48"/></g>
        <g class="hg-node" transform="translate(165,400)"><circle r="38"/></g>
        <g class="hg-node" transform="translate(420,405)"><circle r="34"/></g>
      </g>
      <g id="hg-nodes1">
        <g class="hg-node" transform="translate(248,142)"><circle r="46"/></g>
        <g class="hg-node" transform="translate(642,120)"><circle r="46"/></g>
        <g class="hg-node" transform="translate(700,272)"><circle r="44"/></g>
        <g class="hg-node" transform="translate(520,372)"><circle r="46"/></g>
        <g class="hg-node" transform="translate(300,352)"><circle r="50"/></g>
        <g class="hg-node" transform="translate(150,230)"><circle r="54"/></g>
      </g>

      <text id="hero-question" x="450" y="222" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-style="italic" font-size="19" fill="#ddd8e9" opacity="0">Ask your research question</text>

      <g id="hg-center" class="hg-node hg-node-center" transform="translate(450,215)">
        <circle r="70"/>
        <text id="hero-counter-num" x="0" y="-4" text-anchor="middle" font-family="'Noto Serif', Georgia, serif" font-size="26" font-weight="700" fill="#fdfdfb">0</text>
        <text id="hero-counter-cap" x="0" y="18" text-anchor="middle" font-size="10" letter-spacing="2.5" font-weight="600" fill="#ddd8e9">PAPERS</text>
      </g>
    </g>
  </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
(function(){
  gsap.registerPlugin(DrawSVGPlugin, ScrollTrigger);
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var stageEl = document.getElementById("stage");
  stageEl.addEventListener("mousemove", function(e){
    var r = stageEl.getBoundingClientRect();
    stageEl.style.setProperty("--mx", ((e.clientX-r.left)/r.width*100).toFixed(1)+"%");
    stageEl.style.setProperty("--my", ((e.clientY-r.top)/r.height*100).toFixed(1)+"%");
    stageEl.style.setProperty("--px", (((e.clientX-r.left)/r.width)-0.5).toFixed(3));
    stageEl.style.setProperty("--py", (((e.clientY-r.top)/r.height)-0.5).toFixed(3));
  });
  stageEl.addEventListener("mouseleave", function(){
    stageEl.style.setProperty("--mx","50%");
    stageEl.style.setProperty("--my","50%");
    stageEl.style.setProperty("--px",0);
    stageEl.style.setProperty("--py",0);
  });

  var svgns = "http://www.w3.org/2000/svg";
  gsap.utils.toArray("#hg-nodes1 .hg-node, #hg-nodes2 .hg-node").forEach(function(g){
    var r = +g.querySelector("circle").getAttribute("r");
    var w1 = Math.max(18, r*.8), w2 = w1*.65;
    [[-6,w1],[3,w2]].forEach(function(row){
      var rect = document.createElementNS(svgns, "rect");
      rect.setAttribute("class", "hg-node-bar");
      rect.setAttribute("x", -row[1]/2);
      rect.setAttribute("y", row[0]);
      rect.setAttribute("width", row[1]);
      rect.setAttribute("height", 4);
      rect.setAttribute("rx", 2);
      g.appendChild(rect);
    });
  });

  var tl = gsap.timeline({
    repeat:-1, yoyo:true, repeatDelay:1.1,
    defaults:{ease:"power2.out", duration:.6},
    paused: reduced
  });
  var counterNumEl = document.getElementById("hero-counter-num");
  function fmtCount(n){
    n = Math.round(n);
    if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"") + "M";
    if(n >= 1000) return Math.round(n/1000) + "K";
    return String(n);
  }
  var counter = {n:0};

  tl.set("#hg-lines1 path", {drawSVG:"0%"})
    .set("#hg-lines2 path", {drawSVG:"0%"})
    .set(["#hg-nodes1 .hg-node","#hg-nodes2 .hg-node"], {opacity:0, scale:0, transformOrigin:"center"})
    .set("#hg-center", {scale:0, transformOrigin:"center"})
    .set(["#hero-counter-num","#hero-counter-cap"], {opacity:0})
    // 1 — pose une question
    .to("#hero-question", {opacity:1, duration:.6})
    .to({}, {duration:.5})
    .to("#hero-question", {opacity:0, duration:.4})
    // 2 — le résultat se cristallise, et le corpus de 80M papiers se révèle rapidement
    .to("#hg-center", {scale:1, duration:.6, ease:"back.out(2)"}, "-=.1")
    .to(["#hero-counter-num","#hero-counter-cap"], {opacity:1, duration:.35}, "-=.3")
    .to(counter, {
      n:80000000, duration:1.1, ease:"power2.out",
      onUpdate:function(){ counterNumEl.textContent = fmtCount(counter.n); }
    }, "-=.2")
    .to({}, {duration:.3})
    // 3 — la recherche s'étend via le knowledge graph
    .to("#hg-lines1 path", {drawSVG:"100%", duration:.8, stagger:.1, ease:"power2.inOut"})
    .to("#hg-nodes1 .hg-node", {opacity:1, scale:1, duration:.35, stagger:.1, ease:"back.out(2)"}, "-=.6")
    .to({}, {duration:.2})
    .to("#hg-lines2 path", {drawSVG:"100%", duration:.6, stagger:.08, ease:"power2.inOut"})
    .to("#hg-nodes2 .hg-node", {opacity:1, scale:1, duration:.3, stagger:.08, ease:"back.out(2)"}, "-=.4")
    .to({}, {duration:1.6});

  if(!reduced){
    ScrollTrigger.create({
      trigger: "#stage", start: "top bottom", end: "bottom top",
      onEnter:function(){tl.play();}, onEnterBack:function(){tl.play();},
      onLeave:function(){tl.pause();}, onLeaveBack:function(){tl.pause();}
    });
  }
})();
</script>
</body>
</html>
