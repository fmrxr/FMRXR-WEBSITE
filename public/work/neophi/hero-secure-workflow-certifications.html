<!-- Feature animation asset — FMRXR Studio × NeoPhi visual system — standalone certifications badge reveal -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="author" content="FMRXR Studio">
<title>NeoPhi · Certifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:'Noto Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#1f122f;color:#ddd8e9;
}
.hero{
  position:relative;width:100vw;height:100vh;min-height:340px;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:
  radial-gradient(circle at 50% 46%,rgba(147,132,187,.16),transparent 46%),
  radial-gradient(circle at 50% 50%,#3e245e 0%,#1f122f 70%);
}
.hero:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.22),transparent 25%,transparent 75%,rgba(0,0,0,.22));
}
.certs{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;
}
.cert-badges{display:flex;align-items:flex-start;gap:26px}
.cert-badge{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(16px);
  animation:badgeIn .7s cubic-bezier(.22,1,.36,1) forwards;
}
.cert-badge:nth-child(1){animation-delay:.15s}
.cert-badge:nth-child(2){animation-delay:.35s}
.cert-badge:nth-child(3){animation-delay:.55s}
@keyframes badgeIn{to{opacity:1;transform:translateY(0)}}
.cert-badge-mark{
  width:96px;height:96px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 35% 30%,#4a2c72,#3e245e 55%,#2a1745 100%);
  box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 0 rgba(147,132,187,0);
  animation:badgeGlow 2.8s ease-in-out infinite;
  animation-delay:inherit;
}
@keyframes badgeGlow{
  0%,100%{box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 0 rgba(147,132,187,0)}
  50%{box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 26px rgba(147,132,187,.35)}
}
.cert-badge-mark svg{display:block;width:100%;height:100%}
.cert-badge-label{
  margin-top:8px;font-size:14px;letter-spacing:.03em;color:#ddd8e9;
  text-align:center;max-width:120px;line-height:1.3
}
.cert-text{
  font-size:14px;letter-spacing:.04em;line-height:1.4;text-align:center;
  opacity:0;animation:textIn .8s ease forwards;animation-delay:.95s;
}
@keyframes textIn{to{opacity:1}}
.cert-text .line1{color:#ddd8e9;font-weight:500}
.cert-text .line2{color:#9384bb;text-transform:uppercase;letter-spacing:.08em;font-size:14px}
@media(prefers-reduced-motion:reduce){
  .cert-badge,.cert-text{animation:none;opacity:1;transform:none}
  .cert-badge-mark{animation:none}
}
</style>
</head>
<body>
<div class="hero">
  <div class="certs">
    <div class="cert-badges">
      <div class="cert-badge" title="ISO/IEC 27001 — Information Security">
        <div class="cert-badge-mark">
          <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="47" stroke="#ddd8e9" stroke-width="1"/>
            <circle cx="50" cy="50" r="40" stroke="#ddd8e9" stroke-width=".6"/>
            <g opacity=".4" transform="translate(50,34)">
              <circle r="16" stroke="#ddd8e9" stroke-width=".9"/>
              <ellipse rx="6.5" ry="16" stroke="#ddd8e9" stroke-width=".7"/>
              <path d="M-16 0 H16" stroke="#ddd8e9" stroke-width=".7"/>
              <path d="M-14 -8 Q0 0 14 -8" stroke="#ddd8e9" stroke-width=".55" fill="none"/>
              <path d="M-14 8 Q0 0 14 8" stroke="#ddd8e9" stroke-width=".55" fill="none"/>
            </g>
            <text x="50" y="63" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="21" font-weight="700" fill="#fdfdfb">ISO</text>
            <text x="50" y="80" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#fdfdfb">27001</text>
          </svg>
        </div>
        <div class="cert-badge-label">Information Security</div>
      </div>
      <div class="cert-badge" title="ISO/IEC 42001 — AI Management System">
        <div class="cert-badge-mark">
          <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="47" stroke="#ddd8e9" stroke-width="1"/>
            <circle cx="50" cy="50" r="40" stroke="#ddd8e9" stroke-width=".6"/>
            <g opacity=".4" transform="translate(50,34)">
              <circle r="16" stroke="#ddd8e9" stroke-width=".9"/>
              <ellipse rx="6.5" ry="16" stroke="#ddd8e9" stroke-width=".7"/>
              <path d="M-16 0 H16" stroke="#ddd8e9" stroke-width=".7"/>
              <path d="M-14 -8 Q0 0 14 -8" stroke="#ddd8e9" stroke-width=".55" fill="none"/>
              <path d="M-14 8 Q0 0 14 8" stroke="#ddd8e9" stroke-width=".55" fill="none"/>
            </g>
            <text x="50" y="63" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="21" font-weight="700" fill="#fdfdfb">ISO</text>
            <text x="50" y="80" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#fdfdfb">42001</text>
          </svg>
        </div>
        <div class="cert-badge-label">AI<br>Management</div>
      </div>
      <div class="cert-badge" title="ISO 9001 — Quality Management">
        <div class="cert-badge-mark">
          <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="50" r="47" stroke="#ddd8e9" stroke-width="1"/>
            <circle cx="50" cy="50" r="40" stroke="#ddd8e9" stroke-width=".6"/>
            <g opacity=".4" transform="translate(50,34)">
              <circle r="16" stroke="#ddd8e9" stroke-width=".9"/>
              <ellipse rx="6.5" ry="16" stroke="#ddd8e9" stroke-width=".7"/>
              <path d="M-16 0 H16" stroke="#ddd8e9" stroke-width=".7"/>
              <path d="M-14 -8 Q0 0 14 -8" stroke="#ddd8e9" stroke-width=".55" fill="none"/>
              <path d="M-14 8 Q0 0 14 8" stroke="#ddd8e9" stroke-width=".55" fill="none"/>
            </g>
            <text x="50" y="63" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="21" font-weight="700" fill="#fdfdfb">ISO</text>
            <text x="50" y="80" text-anchor="middle" font-family="'Noto Sans',sans-serif" font-size="13" font-weight="600" fill="#fdfdfb">9001</text>
          </svg>
        </div>
        <div class="cert-badge-label">Quality Management</div>
      </div>
    </div>
    <div class="cert-text">
      <div class="line1">Developed and Maintained by F.Initiatives</div>
      <div class="line2">A Certified company</div>
    </div>
  </div>
</div>
</body>
</html>
