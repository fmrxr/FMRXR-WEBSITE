<!-- Feature animation asset — FMRXR Studio × Neophi visual system -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="FMRXR Studio">
<title>NeoPhi · Hero: Synthesis with Sources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:transparent;
    font-family:'Noto Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;
  }
  .frame{
    width:100%;
    max-width:960px;
    aspect-ratio:4/3;
    position:relative;
    overflow:hidden;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#3e245e 0%,#1f122f 70%);
  }
  .frame svg{width:100%;height:100%;display:block}
  .paper{fill:#3e245e;stroke:#9384bb;stroke-width:1}
  .paper-line{stroke:#ddd8e9;stroke-width:2;stroke-linecap:round}
  .breathe{animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.28;transform:scale(.88)}50%{opacity:.75;transform:scale(1.08)}}
  .hs-trace{stroke-dasharray:4 5;animation:hstracemarch 1.1s linear infinite}
  @keyframes hstracemarch{to{stroke-dashoffset:-18}}
  #hero-parallax{transform:translate(calc(var(--px,0) * 14px), calc(var(--py,0) * 14px));transition:transform .35s ease-out}
  @media(prefers-reduced-motion: reduce){.breathe{animation:none}.hs-trace{animation:none}}
</style>
</head>
<body>

<div class="frame" id="stage">
  <svg viewBox="0 -117.5 900 675" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="glow3">
        <stop offset="0%" stop-color="#9384bb" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#9384bb" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="hero-parallax">
    <circle class="breathe" cx="450" cy="220" r="180" fill="url(#glow3)"/>
    <path id="hs-trace1" class="hs-trace" d="M392 235 Q200 150 128 95" fill="none" stroke="#9384bb" stroke-width="1.3" opacity="0"/>
    <path id="hs-trace2" class="hs-trace" d="M440 244 Q200 220 128 188" fill="none" stroke="#9384bb" stroke-width="1.3" opacity="0"/>
    <path id="hs-trace3" class="hs-trace" d="M488 235 Q250 290 123 273" fill="none" stroke="#9384bb" stroke-width="1.3" opacity="0"/>
    <path id="hs-trace4" class="hs-trace" d="M392 253 Q680 150 800 100" fill="none" stroke="#9384bb" stroke-width="1.3" opacity="0"/>
    <path id="hs-trace5" class="hs-trace" d="M440 253 Q650 200 795 188" fill="none" stroke="#9384bb" stroke-width="1.3" opacity="0"/>
    <path id="hs-trace6" class="hs-trace" d="M488 253 Q680 290 800 273" fill="none" stroke="#9384bb" stroke-width="1.3" opacity="0"/>
    <g id="hs-papers">
      <g id="hs-src1" class="hs-src" data-tx="-90" data-ty="-60"><rect class="paper" x="70" y="45" width="58" height="76" rx="5"/><path class="paper-line" d="M82 66h34M82 78h28M82 90h34"/></g>
      <g id="hs-src2" class="hs-src" data-tx="-110" data-ty="0"><rect class="paper" x="65" y="150" width="58" height="76" rx="5"/><path class="paper-line" d="M77 171h34M77 183h28M77 195h34"/></g>
      <g id="hs-src3" class="hs-src" data-tx="-90" data-ty="60"><rect class="paper" x="70" y="255" width="58" height="76" rx="5"/><path class="paper-line" d="M82 276h34M82 288h28M82 300h34"/></g>
      <g id="hs-src4" class="hs-src" data-tx="90" data-ty="-60"><rect class="paper" x="772" y="45" width="58" height="76" rx="5"/><path class="paper-line" d="M784 66h34M784 78h28M784 90h34"/></g>
      <g id="hs-src5" class="hs-src" data-tx="110" data-ty="0"><rect class="paper" x="777" y="150" width="58" height="76" rx="5"/><path class="paper-line" d="M789 171h34M789 183h28M789 195h34"/></g>
      <g id="hs-src6" class="hs-src" data-tx="90" data-ty="60"><rect class="paper" x="772" y="255" width="58" height="76" rx="5"/><path class="paper-line" d="M784 276h34M784 288h28M784 300h34"/></g>
    </g>
    <g id="hs-card" opacity="0">
      <rect x="360" y="110" width="180" height="210" rx="14" fill="#3e245e" stroke="#9384bb"/>
      <text x="450" y="140" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#ddd8e9">EVIDENCE-BASED ANSWER</text>
      <rect id="hs-l1" x="382" y="160" width="136" height="6" rx="3" fill="#9384bb" style="transform-origin:382px 163px"/>
      <rect id="hs-l2" x="382" y="178" width="112" height="6" rx="3" fill="#9384bb" style="transform-origin:382px 181px"/>
      <rect id="hs-l3" x="382" y="196" width="126" height="6" rx="3" fill="#9384bb" style="transform-origin:382px 199px"/>
      <text id="hs-m1" x="392" y="240" font-size="11" fill="#9384bb" opacity="0">[1]</text>
      <text id="hs-m2" x="440" y="240" font-size="11" fill="#9384bb" opacity="0">[2]</text>
      <text id="hs-m3" x="488" y="240" font-size="11" fill="#9384bb" opacity="0">[3]</text>
      <text id="hs-m4" x="392" y="258" font-size="11" fill="#9384bb" opacity="0">[4]</text>
      <text id="hs-m5" x="440" y="258" font-size="11" fill="#9384bb" opacity="0">[5]</text>
      <text id="hs-m6" x="488" y="258" font-size="11" fill="#9384bb" opacity="0">[6]</text>
    </g>
    </g>
  </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
(function(){
  gsap.registerPlugin(DrawSVGPlugin, ScrollTrigger);
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var stageEl = document.getElementById("stage");
  stageEl.addEventListener("mousemove", function(e){
    var r = stageEl.getBoundingClientRect();
    stageEl.style.setProperty("--mx", ((e.clientX-r.left)/r.width*100).toFixed(1)+"%");
    stageEl.style.setProperty("--my", ((e.clientY-r.top)/r.height*100).toFixed(1)+"%");
    stageEl.style.setProperty("--px", (((e.clientX-r.left)/r.width)-0.5).toFixed(3));
    stageEl.style.setProperty("--py", (((e.clientY-r.top)/r.height)-0.5).toFixed(3));
  });
  stageEl.addEventListener("mouseleave", function(){
    stageEl.style.setProperty("--mx","50%");
    stageEl.style.setProperty("--my","50%");
    stageEl.style.setProperty("--px",0);
    stageEl.style.setProperty("--py",0);
  });

  var tl = gsap.timeline({
    repeat:-1, yoyo:true, repeatDelay:1.1,
    defaults:{ease:"power2.out", duration:.6},
    paused: reduced
  });
  var srcs = gsap.utils.toArray(".hs-src");
  var traceIds = ["#hs-trace1","#hs-trace2","#hs-trace3","#hs-trace4","#hs-trace5","#hs-trace6"];
  var srcIds = ["#hs-src1","#hs-src2","#hs-src3","#hs-src4","#hs-src5","#hs-src6"];
  var markerIds = ["#hs-m1","#hs-m2","#hs-m3","#hs-m4","#hs-m5","#hs-m6"];
  tl.set(srcs, {x:function(i,t){return t.dataset.tx;}, y:function(i,t){return t.dataset.ty;}, opacity:0, scale:.7, transformOrigin:"center"})
    .set("#hs-card", {opacity:0, scale:.85, transformOrigin:"center"})
    .set(["#hs-l1","#hs-l2","#hs-l3"], {scaleX:0})
    .set(markerIds, {opacity:0})
    .set(traceIds, {opacity:0})
    // 1 — the synthesized answer forms
    .to("#hs-card", {opacity:1, scale:1, duration:.5, ease:"back.out(1.6)"})
    .to(["#hs-l1","#hs-l2","#hs-l3"], {scaleX:1, duration:.4, stagger:.12}, "-=.15")
    .to({}, {duration:.1})
    // 2 — citations reveal one at a time, 1 through 6: marker lights up, trace draws, source appears
    .to("#hs-m1", {opacity:1, duration:.2})
    .to("#hs-trace1", {opacity:1, duration:.3}, "-=.05")
    .to("#hs-src1", {x:0, y:0, opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "<")
    .to("#hs-m2", {opacity:1, duration:.2})
    .to("#hs-trace2", {opacity:1, duration:.3}, "-=.05")
    .to("#hs-src2", {x:0, y:0, opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "<")
    .to("#hs-m3", {opacity:1, duration:.2})
    .to("#hs-trace3", {opacity:1, duration:.3}, "-=.05")
    .to("#hs-src3", {x:0, y:0, opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "<")
    .to("#hs-m4", {opacity:1, duration:.2})
    .to("#hs-trace4", {opacity:1, duration:.3}, "-=.05")
    .to("#hs-src4", {x:0, y:0, opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "<")
    .to("#hs-m5", {opacity:1, duration:.2})
    .to("#hs-trace5", {opacity:1, duration:.3}, "-=.05")
    .to("#hs-src5", {x:0, y:0, opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "<")
    .to("#hs-m6", {opacity:1, duration:.2})
    .to("#hs-trace6", {opacity:1, duration:.3}, "-=.05")
    .to("#hs-src6", {x:0, y:0, opacity:1, scale:1, duration:.3, ease:"back.out(2)"}, "<")
    .to({}, {duration:1.5});

  if(!reduced){
    ScrollTrigger.create({
      trigger: "#stage", start: "top bottom", end: "bottom top",
      onEnter:function(){tl.play();}, onEnterBack:function(){tl.play();},
      onLeave:function(){tl.pause();}, onLeaveBack:function(){tl.pause();}
    });
  }
})();
</script>
</body>
</html>
