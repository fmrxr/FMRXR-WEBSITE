<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMRXR// Labs</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c5247; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #tag, #err {
    position: fixed; left: 16px; bottom: 14px; margin: 0;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .15em; text-transform: uppercase; color: #f5f5f8;
    text-shadow: 0 0 8px rgba(0,0,0,.8); pointer-events: none;
  }
  #tag b { color: #7bef7b; font-weight: 700; }
  #err { display: none; top: 16px; right: 16px; bottom: auto; white-space: pre-wrap; text-transform: none; letter-spacing: 0; color: #ff5a5f; }
  #toggle {
    position: fixed; top: 12px; right: 12px; z-index: 3; cursor: pointer;
    font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .15em;
    color: #f5f5f8; background: rgba(13,12,20,.72); border: 1px solid rgba(245,245,248,.18);
    border-radius: 999px; padding: 8px 12px; backdrop-filter: blur(6px);
  }
  #toggle:hover { border-color: #7bef7b; color: #7bef7b; }
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 2; width: 270px; max-width: 86vw;
    overflow-y: auto; padding: 48px 14px 24px; box-sizing: border-box;
    background: rgba(13,12,20,.86); border-left: 1px solid rgba(245,245,248,.12); backdrop-filter: blur(8px);
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #c9c9d2;
    transform: translateX(100%); transition: transform .25s ease;
  }
  #panel.open { transform: none; }
  #panel h4 { margin: 14px 0 4px; font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #7b7a8e; font-weight: 600; }
  #panel .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 5px 0; }
  #panel .row span:last-child { color: #f5f5f8; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { grid-column: 1 / 3; width: 100%; margin: 0; accent-color: #7bef7b; }
  #panel button {
    width: 100%; margin-top: 16px; padding: 8px; cursor: pointer; border-radius: 6px;
    font: inherit; letter-spacing: .15em; text-transform: uppercase;
    color: #f5f5f8; background: transparent; border: 1px solid rgba(245,245,248,.2);
  }
  #panel button:hover { border-color: #7bef7b; color: #7bef7b; }
  #panel .note { margin-top: 12px; color: #7b7a8e; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p id="tag">FMRXR<b>//</b> LABS · <span id="name"></span></p>
<button id="toggle" type="button" aria-expanded="false" aria-controls="panel">PARAMETERS</button>
<aside id="panel" aria-label="Shader parameters"></aside>
<pre id="err"></pre>
<script>
// Lecteur des shaders du mixer EFFET MÈRE, écrits pour un GLSL TOP de
// TouchDesigner. Le fichier .glsl est chargé tel quel : on lui ajoute l'en-tête
// WebGL2 et la variable vUV que TouchDesigner fournit, et ses valeurs par
// défaut sont lues dans le tableau « VALEURS » de son propre en-tête, pour
// qu'une seule source fasse foi.
const SHADERS = {
  phyllotaxis_grid: "Phyllotaxis",
  tox13_depth_tunnel: "Depth tunnel",
  tox4_bouncing_bars: "Bouncing bars",
  tox8_lightpos_noise: "Light field",
};
// Palettes 2028 (palettes-2028.json, généré par scripts/experiences/palettes.py) :
// une palette autour de chaque couleur clé WGSN × Coloro S/S 28 et A/H 27-28.
// Chaque palette = 7 tons réels extraits de l'image de campagne officielle de
// la couleur (camaïeu classé par clarté OKLCH) + un accent, la couleur clé de
// la même saison la plus proche du complémentaire. Appliquée après le shader
// (ses fichiers restent ceux du mixer) selon la règle 60-30-10 : la luminance
// parcourt le camaïeu, et seuls les 10 % les plus lumineux basculent vers
// l'accent. Mode 1 : luminance inversée (fond clair → fond sombre).
const PALETTE = {
  phyllotaxis_grid: "Serene Green",
  tox13_depth_tunnel: "Offline Blue",
  tox4_bouncing_bars: "Positively Yellow",
  tox8_lightpos_noise: "Flourish Pink",
};
const INVERT = { phyllotaxis_grid: true };
const GRADE_GLSL = `
uniform int uGradeMode;   // -1 couleurs d'origine, 0 camaïeu, 1 camaïeu inversé
uniform vec3 uRamp[7];
uniform vec3 uAccent;
vec3 grade(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t > 0.9) return mix(uRamp[6], uAccent, (t - 0.9) / 0.1);
  float x = t / 0.9 * 6.0;
  int i = min(int(floor(x)), 5);
  return mix(uRamp[i], uRamp[i + 1], x - float(i));
}
void main() {
  fx_main();
  if (uGradeMode < 0) return;
  vec3 c = clamp(fragColor.rgb, 0.0, 1.0);
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  fragColor = vec4(grade(uGradeMode == 1 ? 1.0 - l : l), 1.0);
}`;
const hex3 = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16) / 255);
const id =new URLSearchParams(location.search).get("s");
const name = SHADERS[id] ? id : "phyllotaxis_grid";
document.getElementById("name").textContent = SHADERS[name];

const fail = (msg) => {
  const e = document.getElementById("err");
  e.textContent = msg;
  e.style.display = "block";
};

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: false });

const VERT = `#version 300 es
in vec2 aPos;
out vec3 vUV;
void main() { vUV = vec3(aPos * 0.5 + 0.5, 0.0); gl_Position = vec4(aPos, 0.0, 1.0); }`;

function defaults(src) {
  const out = {};
  for (const m of src.matchAll(/^\/\/\s+(u\w+)\s+\|\s+([-\d.eE\s]+)$/gm)) {
    const v = m[2].trim().split(/\s+/).map(Number);
    if (v.length === 4 && v.every(Number.isFinite)) out[m[1]] = v;
  }
  return out;
}

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

async function start() {
  if (!gl) return fail("This experience needs WebGL2. Try a recent Chrome, Edge, Firefox or Safari.");
  const src = await fetch(`${name}.glsl`).then((r) => {
    if (!r.ok) throw new Error(`${name}.glsl: ${r.status}`);
    return r.text();
  });
  const main = /void\s+main\s*\(\s*\)/;
  if (!main.test(src)) throw new Error("main() not found");
  const frag = `#version 300 es\nprecision highp float;\nin vec3 vUV;\n${src.replace(main, "void fx_main()")}${GRADE_GLSL}`;
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const initial = defaults(src);
  const values = {};
  for (const [u, v] of Object.entries(initial)) {
    values[u] = v.slice();
    const loc = gl.getUniformLocation(prog, u);
    if (loc) gl.uniform4fv(loc, v);
  }
  // Bornes publiées seulement pour Phyllotaxis (son aperçu web d'origine).
  const ranges = await fetch(`${name}.ranges.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  const palettes = await fetch("palettes-2028.json").then((r) => r.json()).then((j) => j.palettes);
  const uMode = gl.getUniformLocation(prog, "uGradeMode"), uRamp = gl.getUniformLocation(prog, "uRamp"), uAccent = gl.getUniformLocation(prog, "uAccent");
  const setPalette = (key) => {
    const p = palettes[key];
    if (!p) { gl.uniform1i(uMode, -1); return; }
    gl.uniform3fv(uRamp, p.ramp.flatMap(hex3));
    gl.uniform3fv(uAccent, hex3(p.accent.hex));
    gl.uniform1i(uMode, INVERT[name] ? 1 : 0);
  };
  setPalette(PALETTE[name]);
  buildPanel(prog, src, initial, values, ranges, palettes, setPalette);
  const uTime = gl.getUniformLocation(prog, "u_time");
  const uAspect = gl.getUniformLocation(prog, "u_aspect");

  // Résolution plafonnée : ces shaders sont faits pour un mixer en direct, pas
  // pour un écran 4K à 2x. Le rendu reste net et la carte graphique respire.
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    if (uAspect) gl.uniform1f(uAspect, w / h);
  };

  const t0 = performance.now();
  const frame = (now) => {
    resize();
    if (uTime) gl.uniform1f(uTime, (now - t0) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

// Réglages : un curseur par composante de chaque vec4. Les noms sont ceux des
// commentaires du shader (« uniform vec4 uFrame; // zoom | echelle | … »), les
// composantes « (libre) » n'ont pas de curseur.
// Bornes : celles de <shader>.ranges.json quand elles existent. Sinon aucune
// borne n'est publiée, et la règle est explicite : de 0 à 3 fois la valeur
// d'origine (symétrique si elle est négative, 0 à 1 pour une couleur ou une
// valeur nulle), entier si la valeur d'origine est un entier ≥ 2.
function labelsFrom(src) {
  const out = {};
  for (const m of src.matchAll(/^uniform\s+vec4\s+(u\w+)\s*;\s*\/\/\s*(.+)$/gm)) {
    const parts = m[2].split("|").map((s) => s.trim());
    out[m[1]] = parts.length === 4 ? parts : /rgb/i.test(m[2]) ? ["r", "g", "b", ""] : [m[2].trim(), "", "", ""];
  }
  return out;
}

function fallbackRange(v, label) {
  if (/^(r|g|b)$/.test(label) || v === 0) return [0, 1, 0.001];
  const int = Number.isInteger(v) && Math.abs(v) >= 2;
  const lo = v < 0 ? 3 * v : 0, hi = v < 0 ? -3 * v : 3 * v;
  return [lo, hi, int ? 1 : Math.abs(v) / 200];
}

function fmt(x) {
  return Math.abs(x) >= 100 ? x.toFixed(0) : Math.abs(x) >= 10 ? x.toFixed(2) : x.toFixed(3);
}

function paletteSelect(panel, palettes, current, setPalette) {
  const head = document.createElement("h4");
  head.textContent = "Palette 2028";
  const sel = document.createElement("select");
  sel.style.cssText = "width:100%;padding:6px;background:#14121d;color:#f5f5f8;border:1px solid rgba(245,245,248,.2);border-radius:6px;font:inherit";
  for (const [key, p] of Object.entries(palettes)) {
    sel.append(Object.assign(document.createElement("option"), { value: key, textContent: `${key} · ${p.season} · ${p.coloro}`, selected: key === current }));
  }
  sel.append(Object.assign(document.createElement("option"), { value: "", textContent: "Original colours" }));
  const sw = document.createElement("div");
  sw.style.cssText = "display:flex;height:10px;margin-top:6px;border-radius:3px;overflow:hidden";
  const paint = () => {
    const p = palettes[sel.value];
    sw.innerHTML = p ? [...p.ramp, p.accent.hex].map((h, i) => `<i style="flex:${i === 7 ? 0.6 : 1};background:${h}"></i>`).join("") : "";
  };
  sel.addEventListener("change", () => { setPalette(sel.value); paint(); });
  paint();
  panel.append(head, sel, sw);
}

function buildPanel(prog, src, initial, values, ranges, palettes, setPalette) {
  const panel = document.getElementById("panel");
  const toggle = document.getElementById("toggle");
  paletteSelect(panel, palettes, PALETTE[name], setPalette);
  const labels = labelsFrom(src);
  const inputs = [];
  for (const [u, def] of Object.entries(initial)) {
    const names = labels[u] || [u + ".x", u + ".y", u + ".z", u + ".w"];
    const loc = gl.getUniformLocation(prog, u);
    if (!loc) continue;
    const head = document.createElement("h4");
    head.textContent = u;
    panel.append(head);
    names.forEach((label, i) => {
      if (!label || /libre/i.test(label)) return;
      const [min, max, step] = ranges?.[u]?.[i] ?? fallbackRange(def[i], label);
      const row = document.createElement("label");
      row.className = "row";
      const name = document.createElement("span");
      name.textContent = label;
      const val = document.createElement("span");
      val.textContent = fmt(def[i]);
      const input = Object.assign(document.createElement("input"), { type: "range", min, max, step, value: def[i] });
      input.addEventListener("input", () => {
        values[u][i] = parseFloat(input.value);
        val.textContent = fmt(values[u][i]);
        gl.uniform4fv(loc, values[u]);
      });
      inputs.push({ input, u, i, val, loc });
      row.append(name, val, input);
      panel.append(row);
    });
  }
  const reset = Object.assign(document.createElement("button"), { type: "button", textContent: "Reset" });
  reset.addEventListener("click", () => {
    for (const { input, u, i, val, loc } of inputs) {
      values[u][i] = initial[u][i];
      input.value = initial[u][i];
      val.textContent = fmt(initial[u][i]);
      gl.uniform4fv(loc, values[u]);
    }
  });
  const note = document.createElement("p");
  note.className = "note";
  note.textContent = ranges ? "Ranges from the original preview." : "Ranges: 0 to 3x the original value.";
  panel.append(reset, note);
  toggle.addEventListener("click", () => {
    const open = panel.classList.toggle("open");
    toggle.setAttribute("aria-expanded", String(open));
    toggle.textContent = open ? "CLOSE" : "PARAMETERS";
  });
}

start().catch((e) => fail(`Shader failed to start.\n${e.message}`));
</script>
</body>
</html>
